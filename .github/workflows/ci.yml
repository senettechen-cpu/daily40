# Runs on every push and pull request (added 2026-09-27, system review P0-4).
# Zeabur still deploys main on its own; to make a failing check block a
# deploy, point Zeabur at a branch that only receives green commits, or turn
# its auto-deploy off and deploy by hand after this passes.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix server

      - name: Tests (includes the shared/ copy check)
        run: npm test

      - name: Type check (web)
        run: npx tsc --noEmit -p .

      - name: Type check (server)
        run: npx tsc --noEmit -p server

      - name: Build (web)
        run: npx vite build
